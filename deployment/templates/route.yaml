kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1beta1
metadata:
  name: public-website-http-filter-redirect
spec:
  parentRefs:
  - kind: Gateway
    name: public-website-external-http
    sectionName: http
  hostnames:
  - "*.glance.care"
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
---
kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1beta1
metadata:
  name: public-website-https-route
spec:
  parentRefs:
  - kind: Gateway
    name: public-website-external-http
    sectionName: https
  hostnames:
  - "*.glance.care"
  rules:
  - backendRefs:
    - name: glance-public-site
      port: 3000
---

